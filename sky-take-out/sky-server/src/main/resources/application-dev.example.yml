# Copy this file to application-dev.yml and replace values for your local environment.
sky:
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET_KEY:}
    user-secret-key: ${SKY_JWT_USER_SECRET_KEY:}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DB_HOST:localhost}
    port: ${SKY_DB_PORT:3306}
    database: ${SKY_DB_NAME:sky_take_out}
    username: ${SKY_DB_USERNAME:root}
    password: ${SKY_DB_PASSWORD:}

  alioss:
    endpoint: ${SKY_OSS_ENDPOINT:http://localhost:9000}
    access-key-id: ${SKY_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${SKY_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${SKY_OSS_BUCKET_NAME:sky-take-out}

  redis:
    host: ${SKY_REDIS_HOST:localhost}
    port: ${SKY_REDIS_PORT:6379}
    password: ${SKY_REDIS_PASSWORD:}
    database: ${SKY_REDIS_DATABASE:0}

  rabbitmq:
    host: ${SKY_RABBITMQ_HOST:localhost}
    port: ${SKY_RABBITMQ_PORT:5672}
    username: ${SKY_RABBITMQ_USERNAME:guest}
    password: ${SKY_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SKY_RABBITMQ_VIRTUAL_HOST:/}

  order:
    timeout-minutes: ${SKY_ORDER_TIMEOUT_MINUTES:15}
    outbox-batch-size: ${SKY_ORDER_OUTBOX_BATCH_SIZE:100}
    outbox-relay-delay-ms: ${SKY_ORDER_OUTBOX_RELAY_DELAY_MS:1000}
    outbox-retry-delay-seconds: ${SKY_ORDER_OUTBOX_RETRY_DELAY_SECONDS:30}
    publisher-confirm-timeout-ms: ${SKY_ORDER_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}

  wechat:
    appid: ${SKY_WECHAT_APP_ID:}
    secret: ${SKY_WECHAT_SECRET:}
    mch-id: ${SKY_WECHAT_MCH_ID:}
    mch-serial-no: ${SKY_WECHAT_MCH_SERIAL_NO:}
    private-key-file-path: ${SKY_WECHAT_PRIVATE_KEY_FILE_PATH:}
    api-v3-key: ${SKY_WECHAT_API_V3_KEY:}
    wechat-pay-cert-file-path: ${SKY_WECHAT_PAY_CERT_FILE_PATH:}
    notify-url: ${SKY_WECHAT_NOTIFY_URL:}
    refund-notify-url: ${SKY_WECHAT_REFUND_NOTIFY_URL:}

  shop:
    address: ${SKY_SHOP_ADDRESS:}

  baidu:
    ak: ${SKY_BAIDU_AK:}
